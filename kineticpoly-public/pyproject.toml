[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kineticpoly"
version = "0.1.0"
description = "Market data and execution infrastructure for Polymarket sports markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KineticPoly Contributors", email = "opensource@example.com" }]
dependencies = [
    "aiohttp>=3.9",
    "flask>=3.0",
    "numpy>=1.26",
    "requests>=2.31",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
